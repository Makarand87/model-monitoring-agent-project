[project]
name = "model-monitoring-agent"
version = "0.1.0"
description = "My attempt at building MRM Agent: A deterministic Way"
license = "MIT AND (Apache-2.0)"
readme = "README.md"
authors = [{ name = "Makarand", email = "makarand.ghule@gmail.com" }]
maintainers = [{name = "Makarand", email = "makarand.ghule@gmail.com"}]
keywords = ['rag', 'openai', 'embedding', 'deterministic']
classifiers = [
  # How mature is this project? Common values are (3 - Alpha | 4 - Beta | 5 - Production/Stable)
  "Development Status :: 3 - Alpha",

  # Indicate who your project is intended for
  "Intended Audience :: Model Risk Managers",
  "Topic :: MRM Agent :: Build Tools",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain-openai>=1.0",
    "openai>=1.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "ragas>=0.4,<0.5",
    "typing-inspection==0.4.4",
]

[project.scripts]
model-monitoring-agent = "model_monitoring_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
# Add directories to the Python search path (relative to project root)
pythonpath = [
  ".",
  "src"
]

# Standard pytest configs
testpaths = ["tests"]
addopts = "-ra -q"


